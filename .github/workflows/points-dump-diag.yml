name: Diagnostic - Dump Actor Points

# Throwaway, read-only diagnostic. Not part of the normal pipeline — no
# schedule, workflow_dispatch only. Safe to delete along with this branch
# once used.
on:
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dump ledger for target actors
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
        run: python scripts/dump_actor_points.py
