name: Engineering Points Scoring

# Nightly, scheduled after the Linear sync so the day's closed tickets and
# label changes are already landed. Read-only over already-normalized
# data — no Linear API calls, so this doesn't compete with sync.yml's rate
# budget.
on:
  schedule:
    # 03:30 UTC — well after the hourly sync (sync.yml, :00) has had a full
    # cycle to land the day's activity.
    - cron: "30 3 * * *"
  workflow_dispatch: {}

# Never let two scoring runs overlap (they share the sync_state watermark).
concurrency:
  group: score-points
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
        run: alembic upgrade head

      - name: Run Engineering Points scoring
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: "true"
        # A non-zero exit (any phase failed) fails the job loudly; the
        # watermark is NOT advanced, so the next run safely re-scores.
        run: python -m app.jobs.score_points
